name: production smoke

on:
  workflow_run:
    workflows:
      - checks
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check production MCP health
        env:
          HEALTH_URL: https://repofinder-mcp.theroach.workers.dev/health
        run: |
          for attempt in {1..12}; do
            body="$(curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" || true)"
            if [[ "$body" == *'"ok":true'* && "$body" == *'"service":"repofinder-mcp"'* ]]; then
              echo "Production MCP health check passed."
              exit 0
            fi

            echo "Health check attempt $attempt did not return the expected payload."
            sleep 5
          done

          echo "Production MCP health check failed after retries."
          exit 1
