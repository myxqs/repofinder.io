name: checks

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify Wrangler generated types
        run: npx wrangler types --check --config wrangler.jsonc

      - name: Validate Worker bundles
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler-ci/site
          npx wrangler deploy --config wrangler.mcp.jsonc --dry-run --outdir .wrangler-ci/mcp

      - name: Run typecheck and tests
        run: npm run check
