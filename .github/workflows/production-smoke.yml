name: production smoke

on:
  check_run:
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_run.name == 'Workers Builds: repofinder-mcp' &&
       github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
       github.event.check_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check production MCP health
        env:
          HEALTH_URL: https://repofinder-mcp.theroach.workers.dev/health
        run: |
          for attempt in {1..12}; do
            body="$(curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" || true)"
            if [[ "$body" == *'"ok":true'* && "$body" == *'"service":"repofinder-mcp"'* ]]; then
              echo "Production MCP health check passed after Cloudflare deployment."
              exit 0
            fi

            echo "Health check attempt $attempt did not return the expected payload."
            sleep 5
          done

          echo "Production MCP health check failed after retries."
          exit 1
